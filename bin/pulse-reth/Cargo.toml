[package]
name = "pulse-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "PulseChain node implementation"
default-run = "pulse-reth"

[lints]
workspace = true

[dependencies]
# reth
reth.workspace = true
reth-chainspec.workspace = true
reth-cli.workspace = true
reth-cli-util.workspace = true
reth-node-builder.workspace = true

# pulsechain
reth-pulsechain-chainspec.workspace = true
reth-pulsechain-node.workspace = true

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
tracing.workspace = true

[features]
default = ["jemalloc"]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth/jemalloc",
]
jemalloc-prof = [
    "reth-cli-util/jemalloc",
    "reth-cli-util/jemalloc-prof",
    "reth/jemalloc-prof",
]

asm-keccak = [
    "reth/asm-keccak",
]

[[bin]]
name = "pulse-reth"
path = "src/main.rs"
